<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3b8d3">
  <meta name="description" content="砂糖惑星で公開している連載小説の各話一覧です。">
  <title>小説一覧 | 砂糖惑星</title>
  <style>
    :root {
      --pink: #f3b8d3;
      --blue: #283bbc;
      --ink: #252a67;
      --cream: #fff5e9;
      --yellow: #fbe986;
      --mint: #d9edcf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--pink) url("assets/background.svg") repeat center top / 240px 240px;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.8;
    }
    .page { width: min(100% - 40px, 880px); margin: 0 auto; padding: 34px 0 44px; }
    .top-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 25px; font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    .top-nav a, .bottom-nav a { display: inline-block; color: var(--ink); text-decoration: none;
      background: var(--yellow); border: 1px solid var(--ink); border-radius: 50px;
      padding: 9px 19px; box-shadow: 3px 4px 0 var(--blue); }
    .site-name { letter-spacing: .12em; }
    .book { position: relative; background: var(--cream); border: 1px solid #c18f9e;
      border-radius: 6px 6px 54px 6px; box-shadow: 9px 10px 0 rgba(199,119,166,.35);
      padding: 55px clamp(22px, 7vw, 79px) 67px; }
    .book::before { content: ""; position: absolute; inset: 14px; pointer-events: none;
      border: 1px dashed #cb91ac; border-radius: 2px 2px 42px 2px; }
    .ribbon { position: absolute; top: -16px; left: 28px; color: #ffdfed;
      background: var(--blue); padding: 8px 23px; transform: rotate(-3deg);
      font: bold 11px/1.3 Georgia, serif; letter-spacing: .18em; }
    .book-header { position: relative; text-align: center; }
    .kicker { margin: 0 0 12px; color: var(--blue); font: italic 14px Georgia, serif;
      letter-spacing: .18em; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 32px); letter-spacing: .14em; line-height: 1.5; }
    .subheading { margin: 9px 0 0; font-size: 13px; letter-spacing: .14em; }
    .heading-divider { margin: 25px auto 33px; color: var(--blue); font-size: 21px;
      letter-spacing: .45em; }
    .chapter-list { position: relative; list-style: none; padding: 0; margin: 0; display: grid; gap: 13px; }
    .chapter-link { display: grid; grid-template-columns: 90px minmax(0,1fr) 18px; align-items: center;
      gap: 14px; min-height: 82px; text-decoration: none; color: var(--ink);
      background: #fffdf7; border: 1px solid #bf9bab; border-radius: 8px 28px 8px 8px;
      padding: 15px 20px; box-shadow: 3px 4px 0 #e7c8d4;
      transition: transform .2s, box-shadow .2s; }
    .chapter-list li:nth-child(even) .chapter-link { background: #f2f0fc; border-radius: 28px 8px 8px 8px; }
    .chapter-link:hover { transform: translateY(-2px); box-shadow: 4px 6px 0 #d7abc3; }
    .number { font: italic 14px Georgia, serif; color: var(--blue); white-space: nowrap; }
    .chapter-title { font-size: 16px; font-weight: 700; line-height: 1.65; overflow-wrap: anywhere; }
    .arrow { font-size: 20px; text-align: right; }
    .status { position: relative; padding: 20px 4px; text-align: center; font-size: 14px; }
    .bottom-nav { text-align: center; margin-top: 46px; font-weight: 700; font-size: 13px; }
    footer { text-align: center; padding-top: 30px; font-size: 12px; font-weight: 700; letter-spacing: .1em; }
    a:focus-visible { outline: 3px solid #d21b62; outline-offset: 5px; }
    @media (max-width: 600px) {
      .page { width: min(100% - 24px, 880px); padding-top: 19px; }
      .top-nav { font-size: 11px; }
      .top-nav a { padding: 8px 12px; }
      .book { padding: 48px 22px 50px; border-radius: 6px 6px 32px 6px; }
      .book::before { inset: 10px; border-radius: 2px 2px 25px 2px; }
      .ribbon { left: 17px; }
      .chapter-link { grid-template-columns: 1fr 16px; gap: 3px 10px; padding: 15px 17px; }
      .number { grid-column: 1; font-size: 13px; }
      .chapter-title { grid-column: 1; font-size: 15px; }
      .arrow { grid-column: 2; grid-row: 1 / 3; }
    }
    @media (prefers-reduced-motion: reduce) { .chapter-link { transition: none; } }
  </style>
</head>
<body>
  <main class="page">
    <nav class="top-nav" aria-label="サイト内ナビゲーション">
      <a href="./">← 砂糖惑星へ戻る</a>
      <span class="site-name">SUGAR PLANET</span>
    </nav>

    <section class="book" aria-labelledby="page-title">
      <span class="ribbon">SUGAR PLANET / NOVELS</span>
      <header class="book-header">
        <p class="kicker">A collection of chapters</p>
        <h1 id="page-title">NOVELS</h1>
        <p class="subheading">連載小説・各話一覧</p>
        <div class="heading-divider" aria-hidden="true">✦ ✧ ✦</div>
      </header>
      <p id="status" class="status" role="status" aria-live="polite">各話を読み込んでいます…</p>
      <ol id="chapter-list" class="chapter-list" aria-label="小説の各話"></ol>
    </section>

    <nav class="bottom-nav" aria-label="ページ下部のナビゲーション">
      <a href="./">← 砂糖惑星へ戻る</a>
    </nav>
    <footer>© 砂糖惑星 / Sugar Planet</footer>
  </main>

  <script>
    // novels フォルダ内の「novel.html」「novel2.html」「novel3.html」…を自動検出します。
    // 各話の <h1> に入力したタイトルを一覧にも表示します。
    const user = "ZAkamisori";
    const repository = "sugarplanet";
    const branch = "main";
    const chapterDirectory = "novels";
    const status = document.getElementById("status");
    const list = document.getElementById("chapter-list");

    function chapterNumber(filename) {
      const matched = /^novel(\d+)?\.html$/i.exec(filename);
      if (!matched) return null;
      return matched[1] ? Number(matched[1]) : 1;
    }

    function chapterPath(filename) {
      return `${chapterDirectory}/${encodeURIComponent(filename)}`;
    }

    async function getTitle(filename, number) {
      try {
        const response = await fetch(chapterPath(filename));
        if (!response.ok) throw new Error("本文を取得できませんでした");
        const html = await response.text();
        const documentData = new DOMParser().parseFromString(html, "text/html");
        const title = documentData.querySelector("h1")?.textContent?.trim();
        return title || `第${number}話`;
      } catch {
        return `第${number}話`;
      }
    }

    async function showChapters() {
      try {
        const url = `https://api.github.com/repos/${user}/${repository}/contents/${chapterDirectory}?ref=${branch}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error("GitHubから一覧を取得できませんでした");
        const files = await response.json();
        if (!Array.isArray(files)) throw new Error("ファイルの一覧を読み取れませんでした");

        const chapters = files
          .filter(file => file.type === "file")
          .map(file => ({ name: file.name, number: chapterNumber(file.name) }))
          .filter(file => file.number !== null && Number.isSafeInteger(file.number) && file.number > 0)
          .sort((a, b) => a.number - b.number || a.name.localeCompare(b.name));

        if (chapters.length === 0) {
          status.textContent = "まだ公開されている小説はありません。";
          return;
        }

        const titles = await Promise.all(chapters.map(chapter => getTitle(chapter.name, chapter.number)));
        const fragment = document.createDocumentFragment();
        chapters.forEach((chapter, index) => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.className = "chapter-link";
          link.href = chapterPath(chapter.name);

          const number = document.createElement("span");
          number.className = "number";
          number.textContent = `CHAPTER ${String(chapter.number).padStart(2, "0")}`;

          const title = document.createElement("span");
          title.className = "chapter-title";
          title.textContent = titles[index];

          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "→";

          link.append(number, title, arrow);
          item.append(link);
          fragment.append(item);
        });
        list.replaceChildren(fragment);
        status.hidden = true;
      } catch (error) {
        console.error(error);
        status.textContent = "一覧を取得できませんでした。時間を置いてページを再読み込みしてください。";
      }
    }

    showChapters();
  </script>
</body>
</html>
