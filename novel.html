<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3b8d3">
  <meta name="description" content="砂糖惑星の小説本文ページ">
  <title>小説タイトル | 砂糖惑星</title>
  <style>
    :root {
      --pink: #f3b8d3;
      --blue: #283bbc;
      --ink: #252a67;
      --cream: #fff5e9;
      --yellow: #fbe986;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--pink);
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }
    .page {
      width: min(100% - 40px, 880px);
      margin: 0 auto;
      padding: 34px 0 44px;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 25px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .top-nav a, .bottom-nav a {
      color: var(--ink);
      text-decoration: none;
      background: var(--yellow);
      border: 1px solid var(--ink);
      border-radius: 50px;
      padding: 9px 19px;
      box-shadow: 3px 4px 0 var(--blue);
    }
    .site-name { letter-spacing: .12em; }
    .book {
      position: relative;
      padding: 55px clamp(22px, 7vw, 79px) 67px;
      background: var(--cream);
      border: 1px solid #c18f9e;
      border-radius: 6px 6px 54px 6px;
      box-shadow: 9px 10px 0 rgba(199,119,166,.35);
    }
    .book::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px dashed #cb91ac;
      border-radius: 2px 2px 42px 2px;
      pointer-events: none;
    }
    .ribbon {
      position: absolute;
      top: -16px;
      left: 28px;
      padding: 8px 23px;
      color: #ffdfed;
      background: var(--blue);
      font: bold 11px/1.3 Georgia, serif;
      letter-spacing: .18em;
      transform: rotate(-3deg);
    }
    .book-header { position: relative; text-align: center; }
    .book-header .kicker {
      margin: 0 0 15px;
      color: var(--blue);
      font: italic 14px Georgia, serif;
      letter-spacing: .18em;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 3.5vw, 30px);
      line-height: 1.6;
      letter-spacing: .07em;
      overflow-wrap: anywhere;
    }
    .heading-divider {
      margin: 28px auto 36px;
      color: var(--blue);
      font-size: 21px;
      letter-spacing: .45em;
      text-align: center;
    }
    .novel-text {
      position: relative;
      margin: 0;
      color: #29263f;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 2.1;
      letter-spacing: .025em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bottom-nav {
      margin: 46px 0 0;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }
    footer {
      padding: 30px 0 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-align: center;
    }
    a:focus-visible { outline: 3px solid #d21b62; outline-offset: 5px; }
    @media (max-width: 600px) {
      .page { width: min(100% - 24px, 880px); padding-top: 19px; }
      .top-nav { font-size: 11px; }
      .top-nav a { padding: 8px 12px; }
      .book { padding: 48px 26px 50px; border-radius: 6px 6px 32px 6px; }
      .book::before { inset: 10px; border-radius: 2px 2px 25px 2px; }
      .ribbon { left: 17px; }
      .novel-text { font-size: 16px; line-height: 2; letter-spacing: .015em; }
    }
  </style>
</head>
<body id="top">
  <main class="page">
    <nav class="top-nav" aria-label="サイト内ナビゲーション">
      <a href="./">← 砂糖惑星へ戻る</a>
      <span class="site-name">SUGAR PLANET</span>
    </nav>

    <article class="book">
      <span class="ribbon">SUGAR PLANET / NOVEL</span>
      <header class="book-header">
        <p class="kicker">A little story</p>
        <h1>小説タイトル</h1>
        <div class="heading-divider" aria-hidden="true">✦ ✧ ✦</div>
      </header>

      <!-- ▼ この中の文章を、小説の本文に書き換えてください。改行はそのまま表示されます。 -->
      <div class="novel-text">　ここから小説の本文を入力します。
　文章を改行すると、その改行がそのまま表示されます。

「会話文も、このように表示できます」

　段落と段落の間を一行空けることもできます。</div>
      <!-- ▲ 本文ここまで -->
    </article>

    <nav class="bottom-nav" aria-label="本文下ナビゲーション">
      <a href="./">← 砂糖惑星へ戻る</a>
    </nav>
    <footer>© 砂糖惑星 / Sugar Planet</footer>
  </main>
</body>
</html>
